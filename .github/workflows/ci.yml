# Runs on every PR to aws-migration: only the checks for what changed, plus the secret scan. One final job, "checks", is the
# one to require, so a skipped job never blocks a merge. `main` gets these once the branch merges: `main` is listed below for
# that, and for the PR that merges it. A PR can't start this file until it's on the PR's own merge commit, so before that
# merge, other PRs into main don't run it. Nothing here deploys anything.
name: Checks
on:
  pull_request:
    branches: [aws-migration, main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      convex: ${{ steps.diff.outputs.convex }}
      voice: ${{ steps.diff.outputs.voice }}
      pipeline: ${{ steps.diff.outputs.pipeline }}
      api: ${{ steps.diff.outputs.api }}
      tools: ${{ steps.diff.outputs.tools }}
      web: ${{ steps.diff.outputs.web }}
      merge_safe: ${{ steps.diff.outputs.merge_safe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          for AREA in infra convex voice pipeline api web tools; do
            echo "$FILES" | grep -q "^$AREA/" && echo "$AREA=true" >> "$GITHUB_OUTPUT" || echo "$AREA=false" >> "$GITHUB_OUTPUT"
          done
          # The check runs on PRs into aws-migration, and on the PR into main that brings it there, whatever its branch is called.
          # Once it's on main, later PRs don't add it, so it stops by itself.
          if [ "$GITHUB_BASE_REF" = aws-migration ] || git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF...HEAD" | grep -qx scripts/check-merge-safe.mjs; then
            echo "merge_safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge_safe=false" >> "$GITHUB_OUTPUT"
          fi

  # Merging aws-migration into main must change nothing live (docs/build/CUTOVER.md, where its limits are too).
  merge-safe:
    needs: changes
    if: needs.changes.outputs.merge_safe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Into main only after Apple approves 1.0
        env:
          APPROVED: ${{ vars.APPLE_APPROVED_1_0 }}
        run: |
          if [ "$GITHUB_BASE_REF" = main ] && [ "$APPROVED" != yes ]; then
            echo "::error::Apple hasn't approved 1.0: the repo variable APPLE_APPROVED_1_0 isn't yes. Caleb sets it (docs/build/CUTOVER.md, step 1)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trial merge, the reviewed list, the workflows
        run: |
          if [ "$GITHUB_BASE_REF" = main ]; then STRICT=--strict-conflicts; else STRICT=; fi
          node scripts/check-merge-safe.mjs $STRICT
      - name: The rest runs on what main would become
        run: |
          if git -c user.name=ci -c user.email=ci@invalid merge --no-edit --no-verify -q origin/main; then
            echo "Merged origin/main for the checks below."
          else
            git merge --abort
            echo "::warning::This doesn't merge cleanly with main, so the checks below read the branch as it is."
          fi
      # No NEXT_PUBLIC_* here on purpose: this is what Vercel builds if its settings hold no switch, which this job can't read.
      - name: A build with the switches off is today's site
        run: |
          (cd web && npm ci && npm run build)
          node scripts/check-merge-safe.mjs --bundle web/out
      - name: The laptop's worker runs without Sentry
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg # prep.py runs it when imported
          pip install -r pipeline/requirements.txt
          python pipeline/test_worker_no_sentry.py
      - name: The sync's routes refuse everyone with no secret set
        run: |
          npm ci
          npx vitest run convex/syncRead.test.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan this PR's commits
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v --log-opts="origin/$GITHUB_BASE_REF..HEAD" # -v says which rule and file; --redact keeps the value out of the log

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate every root
        run: |
          for ROOT in bootstrap backups envs/staging envs/production; do
            terraform -chdir="infra/$ROOT" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/$ROOT" validate
          done

  convex:
    needs: changes
    if: needs.changes.outputs.convex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p convex --noEmit
      - run: npx vitest run

  voice:
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: homecookd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/homecookd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r pipeline/requirements.txt -r pipeline/requirements-queue.txt
      - name: Unit tests (fakes only)
        run: |
          for TEST in pipeline/test_*.py; do
            echo "== $TEST"
            python "$TEST"
          done

  api:
    needs: changes
    # The pipeline too: api/test/jobsWorker.test.ts runs the real queue worker's code against these routes.
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: homecookd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/homecookd_test
      PIPELINE_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../pipeline/requirements.txt -r ../pipeline/requirements-queue.txt
      # jobsWorker.test.ts skips when it can't import these, and a skip here would hide the contract.
      - run: python -c "import psycopg, sentry_sdk"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The site still builds, and the CloudFront Function still serves every file in that build as Vercel would.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      - run: node --test infra/modules/web/rewrite.test.mjs

  media-copy:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/media-copy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python test_media_copy.py
      - run: python test_stores.py # the fake GCS server isn't here, so its part skips

  checks:
    if: always()
    needs: [changes, merge-safe, secrets, infra, convex, voice, pipeline, api, web, media-copy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed
        run: |
          echo '${{ toJSON(needs.*.result) }}' | grep -qE '"(failure|cancelled)"' && exit 1 || exit 0
