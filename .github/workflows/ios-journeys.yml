# The app on an iOS simulator, driven by Maestro through the journeys in app/e2e/journeys (the spike: one launch journey;
# docs/build/IOS-JOURNEYS.md). It builds the app for the simulator from this commit (no signing, no EAS), against AWS staging,
# and times each phase into the job summary. Free on the public repo's macOS runners.
#
# Rules for a public repo: never pull_request_target (a fork's PR gets no secrets, and journeys that need them skip); the logs
# never print a family link, a test id or a key (::add-mask:: before use); a seeded family is deleted in `if: always()`.
#
# The last job, "ios-journeys", is main's required check (Master Agent, Nov 9). A required check has to report on every PR,
# so this runs on every PR: "scope" (ubuntu, seconds) skips the simulator when the PR changes neither app/ nor this file, and
# "ios-journeys" is green when the journeys passed or were skipped, red when they failed or were cancelled.
name: ios-journeys

on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-journeys.yml']
  workflow_dispatch:
    inputs:
      native_build:
        description: Build the native app even if one with this fingerprint is cached (to time a native build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-journeys-${{ github.ref }}
  cancel-in-progress: true

env:
  # The aws-staging profile's values (app/eas.json), so the app talks to staging only.
  EXPO_PUBLIC_BACKEND: aws
  EXPO_PUBLIC_AWS_URL: https://d2zh46br3dalyf.cloudfront.net
  EXPO_PUBLIC_BUCKET_URL: https://d1l67cvw778iu0.cloudfront.net
  APP_ID: com.salik.homecookd
  # Pinned, and over two weeks old when chosen; the zip's sha256 is checked before it runs.
  MAESTRO_VERSION: cli-2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  # Maestro sends anonymous usage data unless this is set.
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  # The same test as scripts/check-sim.mjs: the app/ tree against the base this PR was merged onto (HEAD^1 of GitHub's merge
  # commit). Pushes to main and manual runs always go on.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse HEAD:app)" != "$(git rev-parse HEAD^1:app)" ] || ! git diff --quiet HEAD^1 HEAD -- .github/workflows/ios-journeys.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No app/ change in this PR (its app/ tree is the base's), so the simulator journeys don't run." >> "$GITHUB_STEP_SUMMARY"
          fi

  journeys:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      # The same Xcode as EAS's builds (build 22: the iPhoneOS 26.5 SDK). Expo SDK 57's ExpoModulesJSI needs Swift 6.2, and its
      # C++ headers fail on 26.3's compiler, so anything older than 26.5 stops here with a plain message.
      - name: Use Xcode 26.5 or newer (what EAS builds with)
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          V=$(basename "$XCODE" .app | sed 's/Xcode_//')
          if [ -z "$XCODE" ] || [ "$(printf '%s\n' 26.5 "$V" | sort -V | head -1)" != "26.5" ]; then
            echo "::error::This runner image's newest Xcode is ${V:-none}; EAS builds with 26.5"; exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version | head -1
      # A new simulator spends about 7 minutes on "Data Migration" before it's usable (spike runs 42571326165: 7m21s), so it
      # starts now and boots while the app builds. A later step waits for it.
      - name: Start booting a simulator (it boots while the app builds)
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices;const all=Object.entries(d).filter(([k])=>/iOS/.test(k)).flatMap(([,v])=>v);const p=all.find(x=>/^iPhone 16$/.test(x.name))||all.find(x=>/^iPhone/.test(x.name));console.log(p.udid)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's packages
        working-directory: app
        run: npm ci
      # The native app is built once per native fingerprint (@expo/fingerprint: native packages, plugins, the app config,
      # the icon and splash; never app/src). A PR that changes only JS reuses it and gets a new JS bundle below, which is
      # what an EAS Update does to a phone. The key also holds this file, so a change to how the app is built rebuilds it.
      - name: Native fingerprint
        id: fingerprint
        working-directory: app
        run: |
          FP=$(node node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate --platform ios | node -e "console.log(JSON.parse(require('fs').readFileSync(0)).hash)")
          echo "Native fingerprint: $FP"
          echo "key=ios-app-${{ runner.arch }}-$FP-${{ hashFiles('.github/workflows/ios-journeys.yml') }}" >> "$GITHUB_OUTPUT"
      # A manual run with native_build skips this, so the native build below runs (and times) even when the app is cached.
      - name: Restore the built app (same native fingerprint)
        id: built
        if: ${{ !inputs.native_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/built
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Prebuild iOS
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npx expo prebuild --platform ios --clean --no-install
          # The journeys always run this commit's own JS, never a published update. (A build made without EAS sends no
          # channel, and EAS answers 400 to that, but this makes it certain and skips the check at launch.) The app code
          # doesn't call expo-updates.
          plutil -replace EXUpdatesEnabled -bool NO ios/homecookd/Supporting/Expo.plist
          echo "T_PREBUILD=$(date +%s)" >> "$GITHUB_ENV"
      # ccache through React Native's own route (USE_CCACHE=1 at pod install: CC and CXX become RN's ccache-clang wrappers,
      # with RN's ccache.conf), not as a compiler launcher, which clashed with Xcode's explicit modules in the spike. Its
      # folder is kept in the Actions cache: each native build saves a new copy and restores the newest. Pinned 4.14.2 (Oct 18),
      # the darwin release's sha256, downloaded with the job's token (#447).
      - name: Install ccache (pinned, checked)
        if: steps.built.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.14.2 --repo ccache/ccache --pattern ccache-4.14.2-darwin.tar.gz --output "$RUNNER_TEMP/ccache.tar.gz"
          echo "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  $RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Restore ccache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.arch }}-
      - name: Restore Pods
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ios/Pods
          key: ios-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json', 'app/app.config.ts', 'app/plugins/**') }}
          restore-keys: ios-${{ runner.os }}-
      - name: Pods
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app/ios
        run: |
          ccache --version | head -1
          ccache --max-size 3G
          USE_CCACHE=1 pod install
          echo "T_PODS=$(date +%s)" >> "$GITHUB_ENV"
      # arm64 only: a Release build for the generic simulator builds every simulator architecture (x86_64 too), and the
      # runner and its simulator are arm64. dwarf only: no dSYM (about 25 s), which a simulator run never reads.
      - name: "Build for the simulator (Release, so the JS is bundled in: no Metro)"
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app/ios
        run: |
          LOG="$RUNNER_TEMP/maestro-out/xcodebuild.log"
          mkdir -p "$RUNNER_TEMP/maestro-out"
          ccache --zero-stats >/dev/null
          set +e
          xcodebuild -workspace homecookd.xcworkspace -scheme homecookd -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf \
            -showBuildTimingSummary build > "$LOG" 2>&1
          CODE=$?
          set -e
          tail -15 "$LOG"
          if [ $CODE -ne 0 ]; then
            echo "::group::Errors"; grep -n -E "error:|\*\* BUILD FAILED|The following build commands failed" "$LOG" | head -40; echo "::endgroup::"
            # A failing script phase prints its own output just before its "Command PhaseScriptExecution failed" line.
            echo "::group::Failing script phases"; grep -n -B60 "Command PhaseScriptExecution failed" "$LOG" | tail -120; echo "::endgroup::"
            exit $CODE
          fi
          echo "::group::Where the build's time went"; sed -n '/Build Timing Summary/,$p' "$LOG" | head -40; echo "::endgroup::"
          echo "::group::ccache"; ccache --show-stats; echo "::endgroup::"
          echo "CCACHE_LINE=$(ccache --print-stats | awk -F'\t' '$1=="direct_cache_hit"||$1=="preprocessed_cache_hit"{h+=$2} $1=="cache_miss"{m=$2} END{printf "%d hits, %d misses", h, m}')" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/built"
          cp -R build/Build/Products/Release-iphonesimulator/homecookd.app "$RUNNER_TEMP/built/"
          echo "T_BUILD=$(date +%s)" >> "$GITHUB_ENV"
      - name: Keep the built app for the next run with this native fingerprint
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/built
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Keep ccache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only JS changed since that build: bundle this commit's JS into it exactly as Xcode's "Bundle React Native code and
      # images" phase does (expo export:embed, then the same hermesc to bytecode), the way an EAS Update replaces a phone's JS.
      - name: Bundle this commit's JS into the built app
        if: steps.built.outputs.cache-hit == 'true'
        working-directory: app
        run: |
          echo "T_PREBUILD=$(date +%s)" >> "$GITHUB_ENV"
          echo "T_PODS=$(date +%s)" >> "$GITHUB_ENV"
          APP="$RUNNER_TEMP/built/homecookd.app"
          test -f "$APP/main.jsbundle"
          ENTRY=$(node -e "require('expo/scripts/resolveAppEntry')" "$PWD" ios absolute)
          HERMESC=$(node -p "require('path').join(require('path').dirname(require.resolve('hermes-compiler', { paths: [require.resolve('react-native/package.json')] })), 'hermesc', 'osx-bin', 'hermesc')")
          npx expo export:embed --entry-file "$ENTRY" --platform ios --dev false --reset-cache --minify false \
            --bundle-output "$RUNNER_TEMP/main.jsbundle" --assets-dest "$APP"
          # hermesc warns about every browser global it can't see (Xcode's phase prints the same); the log is kept.
          mkdir -p "$RUNNER_TEMP/maestro-out"
          "$HERMESC" -emit-binary -O -out "$APP/main.jsbundle" "$RUNNER_TEMP/main.jsbundle" 2> "$RUNNER_TEMP/maestro-out/hermesc.log" \
            || { tail -40 "$RUNNER_TEMP/maestro-out/hermesc.log"; exit 1; }
          echo "T_BUILD=$(date +%s)" >> "$GITHUB_ENV"
          echo "NATIVE=reused" >> "$GITHUB_ENV"
      - name: Wait for the simulator and install the app
        run: |
          cat "$RUNNER_TEMP/simctl-boot.log" || true
          xcrun simctl bootstatus "$UDID" -b > "$RUNNER_TEMP/bootstatus.log" 2>&1 || { tail -20 "$RUNNER_TEMP/bootstatus.log"; exit 1; }
          tail -1 "$RUNNER_TEMP/bootstatus.log"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/built/homecookd.app"
          echo "T_BOOT=$(date +%s)" >> "$GITHUB_ENV"
      # With the job's token: on Nov 9 GitHub answered anonymous release downloads with 504 for hours (#447).
      - name: Install Maestro (pinned, checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MAESTRO_VERSION" --repo mobile-dev-inc/Maestro --pattern maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Journeys
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-out"
          maestro --device "$UDID" test app/e2e/journeys --format junit --output "$RUNNER_TEMP/maestro-out/report.xml" \
            --test-output-dir "$RUNNER_TEMP/maestro-out" -e APP_ID="$APP_ID"
          echo "T_JOURNEYS=$(date +%s)" >> "$GITHUB_ENV"
      - name: Times
        if: always()
        run: |
          m() { if [ -n "$2" ] && [ -n "$1" ]; then echo "$(( ($2 - $1) / 60 ))m $(( ($2 - $1) % 60 ))s"; else echo "—"; fi; }
          {
            echo "### iOS journeys: times (native app ${NATIVE:-built}${CCACHE_LINE:+; ccache: $CCACHE_LINE})"
            echo "| Phase | Time |"; echo "|---|---|"
            echo "| npm ci + prebuild | $(m "$T0" "$T_PREBUILD") |"
            echo "| Pods (with cache) | $(m "$T_PREBUILD" "$T_PODS") |"
            echo "| xcodebuild Release, or the JS bundle into the reused app | $(m "$T_PODS" "$T_BUILD") |"
            echo "| Wait for the simulator (booting since the start) + install | $(m "$T_BUILD" "$T_BOOT") |"
            echo "| Maestro journeys | $(m "$T_BOOT" "$T_JOURNEYS") |"
            echo "| **Total** | $(m "$T0" "${T_JOURNEYS:-$(date +%s)}") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep Maestro's screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maestro-out
          retention-days: 7
          if-no-files-found: ignore

  # The one to require on main: a skipped journeys job (no app/ change) passes, a failed or cancelled one doesn't.
  result:
    name: ios-journeys
    if: always()
    needs: [scope, journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Journeys passed, or there was nothing to run
        run: |
          echo "scope: ${{ needs.scope.result }}, journeys: ${{ needs.journeys.result }}"
          [ "${{ needs.scope.result }}" = "success" ] || exit 1
          case "${{ needs.journeys.result }}" in success|skipped) exit 0 ;; *) exit 1 ;; esac
