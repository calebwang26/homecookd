# The app on an iOS simulator, driven by Maestro through the journeys in app/e2e/journeys (the spike: one launch journey;
# docs/build/IOS-JOURNEYS.md). It builds the app for the simulator from this commit (no signing, no EAS), against AWS staging,
# and times each phase into the job summary. Free on the public repo's macOS runners.
#
# Rules for a public repo: never pull_request_target (a fork's PR gets no secrets, and journeys that need them skip); the logs
# never print a family link, a test id or a key (::add-mask:: before use); a seeded family is deleted in `if: always()`.
#
# The last job, "ios-journeys", is main's required check (Master Agent, Nov 9). A required check has to report on every PR,
# so this runs on every PR: "scope" (ubuntu, seconds) skips the simulator when the PR changes neither app/ nor this file, and
# "ios-journeys" is green when the journeys passed or were skipped, red when they failed or were cancelled.
name: ios-journeys

on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-journeys.yml']
  workflow_dispatch:
    inputs:
      native_build:
        description: Build the native app even if one with this fingerprint is cached (to time a native build)
        type: boolean
        default: false
      no_key:
        description: "Run as a fork's PR would: no TEST_SIGNIN_KEY, so journey 2 must skip, not fail"
        type: boolean
        default: false
      stall_api:
        description: "Make the staging api hang, to check open-link.yaml's Try again (first-try: must pass after one; all: must fail)"
        type: choice
        options: ['off', first-try, all]
        default: 'off'
      openurl_fault:
        description: "Treat the first link open the app gets on its own as one iOS gave up on (Code=60), to check that a link that still lands passes with a Journey retry warning"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-journeys-${{ github.ref }}
  cancel-in-progress: true

env:
  # The aws-staging profile's values (app/eas.json), so the app talks to staging only.
  EXPO_PUBLIC_BACKEND: aws
  EXPO_PUBLIC_AWS_URL: https://d2zh46br3dalyf.cloudfront.net
  EXPO_PUBLIC_BUCKET_URL: https://d1l67cvw778iu0.cloudfront.net
  # The simulator-only hooks (#435): journey 2's homecookd://e2e/sign-in. Store builds never set it, and
  # scripts/check-e2e-stripped.mjs (ci.yml's e2e-stripped) proves their exports hold none of the hook.
  EXPO_PUBLIC_E2E: '1'
  # Journey 4's stand-in camera films this 5 s clip (staging media) for each file: a simulator has no camera.
  EXPO_PUBLIC_E2E_CLIP_URL: https://d1l67cvw778iu0.cloudfront.net/e2e/clip-5s.mp4
  APP_ID: com.salik.homecookd
  # Pinned, and over two weeks old when chosen; the zip's sha256 is checked before it runs.
  MAESTRO_VERSION: cli-2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  # Maestro sends anonymous usage data unless this is set.
  MAESTRO_CLI_NO_ANALYTICS: '1'
  # Maestro's XCTest driver didn't start within its default wait once (run 42759943404 attempt 2: "iOS driver not ready
  # in time, consider increasing timeout by configuring MAESTRO_DRIVER_STARTUP_TIMEOUT"). 3 minutes, in ms.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'

jobs:
  # The same test as scripts/check-sim.mjs: the app/ tree against the base this PR was merged onto (HEAD^1 of GitHub's merge
  # commit). Pushes to main and manual runs always go on.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse HEAD:app)" != "$(git rev-parse HEAD^1:app)" ] || ! git diff --quiet HEAD^1 HEAD -- .github/workflows/ios-journeys.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No app/ change in this PR (its app/ tree is the base's), so the simulator journeys don't run." >> "$GITHUB_STEP_SUMMARY"
          fi

  journeys:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      # The same Xcode as EAS's builds (build 22: the iPhoneOS 26.5 SDK). Expo SDK 57's ExpoModulesJSI needs Swift 6.2, and its
      # C++ headers fail on 26.3's compiler, so anything older than 26.5 stops here with a plain message.
      - name: Use Xcode 26.5 or newer (what EAS builds with)
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          V=$(basename "$XCODE" .app | sed 's/Xcode_//')
          if [ -z "$XCODE" ] || [ "$(printf '%s\n' 26.5 "$V" | sort -V | head -1)" != "26.5" ]; then
            echo "::error::This runner image's newest Xcode is ${V:-none}; EAS builds with 26.5"; exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version | head -1
      # A new simulator spends about 7 minutes on "Data Migration" before it's usable (spike runs 42571326165: 7m21s), so it
      # starts now and boots while the app builds. A later step waits for it.
      # The simulator's push daemon (apsd) reconnects to Apple's sandbox push servers about 600 times a minute after boot,
      # and every TLS connection costs trustd two signature checks; then trustd stops answering anyone, the app included
      # (run 42766011110: 1,034 apsd checks in 06:18-06:19Z, then trustd silent and every app check false; the
      # trust-check stall, docs/build/IOS-JOURNEYS.md). No journey uses push, so the push hosts refuse at once instead:
      # the simulator resolves through the runner's /etc/hosts. Set before the boot, so apsd never starts the storm.
      - name: Start booting a simulator (it boots while the app builds)
        run: |
          {
            for h in init.push.apple.com init-p01st.push.apple.com init.sandbox.push.apple.com courier.push.apple.com \
              courier.sandbox.push.apple.com sandbox.push.apple.com api.push.apple.com api.sandbox.push.apple.com; do
              echo "127.0.0.1 $h # no-push"
            done
            for n in $(seq 0 99); do
              echo "127.0.0.1 $n-courier.push.apple.com # no-push"; echo "127.0.0.1 $n-courier.sandbox.push.apple.com # no-push"
            done
          } | sudo tee -a /etc/hosts > /dev/null
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
          echo "Push hosts refused: $(grep -c '# no-push$' /etc/hosts) names"
          UDID=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices;const all=Object.entries(d).filter(([k])=>/iOS/.test(k)).flatMap(([,v])=>v);const p=all.find(x=>/^iPhone 16$/.test(x.name))||all.find(x=>/^iPhone/.test(x.name));console.log(p.udid)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &
          # trustd's first certificate check after boot sets it rebuilding its pinning database, which holds a lock for
          # minutes (run 42786504171: from about 70 s after the first check, 09:13:33-09:17:40, every check waited and
          # failed). So the first check happens here, once the simulator is up, and the rebuild runs during npm ci, Pods
          # and the build. "Wait for the simulator's trust check" then waits for the lock to be gone.
          # trustd's own log from boot to the end of the job, for "Name a certificate stall" (scripts/journey-trust.mjs): the
          # rebuild can also start long after the first check (42898927696: 58 s after the trust check passed), and then
          # trustd checks nothing for minutes. The stream stays on the runner; only counts from it are kept.
          HOST=${EXPO_PUBLIC_AWS_URL#https://}; HOST=${HOST%%/*}
          # (bootstatus without -b, so it never races the boot above; it waits for the boot to finish)
          nohup bash -c "for i in \$(seq 1 240); do xcrun simctl bootstatus '$UDID' > /dev/null 2>&1 && break; sleep 5; done; \
            xcrun simctl spawn '$UDID' log stream --style syslog --level debug --predicate 'process == \"trustd\"' \
              > '$RUNNER_TEMP/trustd-stream.log' 2>/dev/null & \
            sleep 5; xcrun simctl openurl '$UDID' 'https://$HOST/?trust-first-use' && date +%s > '$RUNNER_TEMP/trust-first-use'" \
            > "$RUNNER_TEMP/trust-first-use.log" 2>&1 &
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's packages
        working-directory: app
        run: npm ci
      # The native app is built once per native fingerprint (@expo/fingerprint: native packages, plugins, the app config,
      # the icon and splash; never app/src). A PR that changes only JS reuses it and gets a new JS bundle below, which is
      # what an EAS Update does to a phone. The key also holds this file, so a change to how the app is built rebuilds it.
      - name: Native fingerprint
        id: fingerprint
        working-directory: app
        run: |
          FP=$(node node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate --platform ios | node -e "console.log(JSON.parse(require('fs').readFileSync(0)).hash)")
          echo "Native fingerprint: $FP"
          echo "key=ios-app-${{ runner.arch }}-$FP-${{ hashFiles('.github/workflows/ios-journeys.yml') }}" >> "$GITHUB_OUTPUT"
      # A manual run with native_build skips this, so the native build below runs (and times) even when the app is cached.
      - name: Restore the built app (same native fingerprint)
        id: built
        if: ${{ !inputs.native_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/built
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Prebuild iOS
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npx expo prebuild --platform ios --clean --no-install
          # The journeys always run this commit's own JS, never a published update. (A build made without EAS sends no
          # channel, and EAS answers 400 to that, but this makes it certain and skips the check at launch.) The app code
          # doesn't call expo-updates.
          plutil -replace EXUpdatesEnabled -bool NO ios/homecookd/Supporting/Expo.plist
          echo "T_PREBUILD=$(date +%s)" >> "$GITHUB_ENV"
      # ccache as Xcode's compiler launcher (C_COMPILER_LAUNCHER on the xcodebuild line below), with React Native's
      # ccache.conf written into ccache's own config file, so the compiles find it without any environment. Not React
      # Native's USE_CCACHE route: its ccache-clang wrapper runs `$CCACHE_BINARY clang`, and Xcode 26 exports CCACHE_BINARY
      # to script phases but not to compile tasks, so the wrapper ran plain clang and ccache saw no calls at all (runs
      # 42596435076, 42601059072 and 42605096278). Pinned 4.14.2 (Oct 18), the darwin release's sha256, downloaded with the
      # job's token (#447). Its folder, ccache's own default, is kept in the Actions cache: each native build saves a new
      # copy and restores the newest.
      - name: Install ccache (pinned, checked)
        id: ccache
        if: steps.built.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.14.2 --repo ccache/ccache --pattern ccache-4.14.2-darwin.tar.gz --output "$RUNNER_TEMP/ccache.tar.gz"
          echo "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  $RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          C="$RUNNER_TEMP/ccache-4.14.2-darwin/ccache"
          sed -n 's/^\([a-z_]*\) = \(.*\)$/\1=\2/p' app/node_modules/react-native/scripts/xcode/ccache.conf |
            while read -r KV; do "$C" --set-config "$KV"; done
          "$C" --version | head -1
          "$C" --show-config | grep -E "\) (cache_dir|sloppiness|depend_mode|file_clone|inode_cache) = " || true
          DIR=$("$C" --get-config cache_dir)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Restore ccache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ccache-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.arch }}-
      - name: Restore Pods
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ios/Pods
          key: ios-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json', 'app/app.config.ts', 'app/plugins/**') }}
          restore-keys: ios-${{ runner.os }}-
      - name: Pods
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app/ios
        run: |
          pod install
          echo "T_PODS=$(date +%s)" >> "$GITHUB_ENV"
      # arm64 only: a Release build for the generic simulator builds every simulator architecture (x86_64 too), and the
      # runner and its simulator are arm64. dwarf only: no dSYM (about 25 s), which a simulator run never reads.
      # Clang's explicit modules off, one of the two choices Xcode's own note gives for a compiler launcher: the plain
      # module compiles are what React Native's ccache.conf is written for, and the three runs timed before this already
      # built without them (Xcode turned them off for RN's wrapper) in about main's time.
      - name: "Build for the simulator (Release, so the JS is bundled in: no Metro)"
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: app/ios
        run: |
          LOG="$RUNNER_TEMP/maestro-out/xcodebuild.log"
          mkdir -p "$RUNNER_TEMP/maestro-out"
          ccache --zero-stats >/dev/null
          set +e
          xcodebuild -workspace homecookd.xcworkspace -scheme homecookd -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf \
            C_COMPILER_LAUNCHER="$(command -v ccache)" CLANG_ENABLE_EXPLICIT_MODULES=NO \
            -showBuildTimingSummary build > "$LOG" 2>&1
          CODE=$?
          set -e
          tail -15 "$LOG"
          if [ $CODE -ne 0 ]; then
            echo "::group::Errors"; grep -n -E "error:|\*\* BUILD FAILED|The following build commands failed" "$LOG" | head -40; echo "::endgroup::"
            # A failing script phase prints its own output just before its "Command PhaseScriptExecution failed" line.
            echo "::group::Failing script phases"; grep -n -B60 "Command PhaseScriptExecution failed" "$LOG" | tail -120; echo "::endgroup::"
            exit $CODE
          fi
          echo "::group::Where the build's time went"; sed -n '/Build Timing Summary/,$p' "$LOG" | head -40; echo "::endgroup::"
          echo "::group::ccache"; ccache --show-stats --verbose; du -sh "$(ccache --get-config cache_dir)" 2>/dev/null || true; echo "::endgroup::"
          echo "CCACHE_LINE=$(ccache --print-stats | awk -F'\t' '$1=="direct_cache_hit"||$1=="preprocessed_cache_hit"{h+=$2} $1=="cache_miss"{m=$2} END{printf "%d hits, %d misses", h, m}')" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/built"
          cp -R build/Build/Products/Release-iphonesimulator/homecookd.app "$RUNNER_TEMP/built/"
          echo "T_BUILD=$(date +%s)" >> "$GITHUB_ENV"
      - name: Keep the built app for the next run with this native fingerprint
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/built
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Keep ccache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ccache-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only JS changed since that build: bundle this commit's JS into it exactly as Xcode's "Bundle React Native code and
      # images" phase does (expo export:embed, then the same hermesc to bytecode), the way an EAS Update replaces a phone's JS.
      - name: Bundle this commit's JS into the built app
        if: steps.built.outputs.cache-hit == 'true'
        working-directory: app
        run: |
          echo "T_PREBUILD=$(date +%s)" >> "$GITHUB_ENV"
          echo "T_PODS=$(date +%s)" >> "$GITHUB_ENV"
          APP="$RUNNER_TEMP/built/homecookd.app"
          test -f "$APP/main.jsbundle"
          ENTRY=$(node -e "require('expo/scripts/resolveAppEntry')" "$PWD" ios absolute)
          HERMESC=$(node -p "require('path').join(require('path').dirname(require.resolve('hermes-compiler', { paths: [require.resolve('react-native/package.json')] })), 'hermesc', 'osx-bin', 'hermesc')")
          npx expo export:embed --entry-file "$ENTRY" --platform ios --dev false --reset-cache --minify false \
            --bundle-output "$RUNNER_TEMP/main.jsbundle" --assets-dest "$APP"
          # hermesc warns about every browser global it can't see (Xcode's phase prints the same); the log is kept.
          mkdir -p "$RUNNER_TEMP/maestro-out"
          "$HERMESC" -emit-binary -O -out "$APP/main.jsbundle" "$RUNNER_TEMP/main.jsbundle" 2> "$RUNNER_TEMP/maestro-out/hermesc.log" \
            || { tail -40 "$RUNNER_TEMP/maestro-out/hermesc.log"; exit 1; }
          echo "T_BUILD=$(date +%s)" >> "$GITHUB_ENV"
          echo "NATIVE=reused" >> "$GITHUB_ENV"
      # Built unsigned (CODE_SIGNING_ALLOWED=NO, until Nov 10), the app had no entitlements, and on a simulator iOS reads
      # an app's identity from them: nsurlsessiond refused its background upload ("does not have a bundle ID, rejecting
      # connection", run 42852281034) and securityd every keychain call ("neither application-identifier nor
      # keychain-access-groups entitlements"). A codesign after the build didn't help (run 42859652079): the simulator
      # reads the "simulated entitlements" Xcode links into the binary (__TEXT,__entitlements) when it signs during the
      # build. So the build signs to run locally (identity "-", no team, no certificate), as Xcode does for a simulator;
      # this step re-signs after the JS swap (the section stays), prints the identifier and the simulated
      # application-identifier, and fails without them. A store build is signed by EAS; none of this reaches it.
      - name: Sign the app for the simulator (ad-hoc)
        run: |
          APP="$RUNNER_TEMP/built/homecookd.app"
          codesign --force --deep --sign - --timestamp=none "$APP"
          ID=$(codesign -dv "$APP" 2>&1 | grep '^Identifier=' || true)
          echo "$ID"
          [ "$ID" = "Identifier=$APP_ID" ] || { echo "::error title=Signing::the app's signed identifier isn't $APP_ID"; exit 1; }
          ENT="$RUNNER_TEMP/simulated-entitlements.plist"; rm -f "$ENT"
          xcrun segedit "$APP/homecookd" -extract __TEXT __entitlements "$ENT" 2>/dev/null || true
          AID=$( [ -s "$ENT" ] && plutil -extract application-identifier raw -o - "$ENT" 2>/dev/null || true)
          echo "Simulated application-identifier=${AID:-none}"
          case "$AID" in *".$APP_ID"|"$APP_ID") ;; *) echo "::error title=Signing::the app has no simulated application-identifier for $APP_ID"; exit 1 ;; esac
      - name: Wait for the simulator and install the app
        run: |
          cat "$RUNNER_TEMP/simctl-boot.log" || true
          xcrun simctl bootstatus "$UDID" -b > "$RUNNER_TEMP/bootstatus.log" 2>&1 || { tail -20 "$RUNNER_TEMP/bootstatus.log"; exit 1; }
          tail -1 "$RUNNER_TEMP/bootstatus.log"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/built/homecookd.app"
          echo "T_BOOT=$(date +%s)" >> "$GITHUB_ENV"
      # With the job's token: on Nov 9 GitHub answered anonymous release downloads with 504 for hours (#447).
      - name: Install Maestro (pinned, checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MAESTRO_VERSION" --repo mobile-dev-inc/Maestro --pattern maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      # The simulator's certificate check (trustd) can stop answering for minutes after boot: in run 42766011110 it ran
      # 2,090 signature checks while mobileassetd fetched its catalogs, then every app connection from 06:19:49 sat in
      # "Asyncing for external verify block" and came back false (docs/build/IOS-JOURNEYS.md, "The trust-check stall").
      # So before any journey, Safari opens the staging api and this waits for one certificate check to answer true: up
      # to 60 s a try, restarting trustd between tries, 3 restarts at most; then the job fails, and no journey runs on a
      # stalled simulator. It runs before the seed step, so no link or key exists yet; its log stays on the runner.
      - name: Wait for the simulator's trust check
        run: |
          HOST=${EXPO_PUBLIC_AWS_URL#https://}; HOST=${HOST%%/*}
          LOG="$RUNNER_TEMP/trust-warmup.log"
          START=$(date +%s); RESTARTS=0; RESTARTED=0; OK=
          # Only a real log line counts (it starts with a date): log stream's own first line, "Filtering the log data
          # using ...", repeats the predicate's words.
          real() { grep -E "^20[0-9]{2}-[0-9]{2}-[0-9]{2} .*$1" "$2" || true; }
          locked() { real 'database is locked' "$LOCKLOG" | wc -l | tr -d ' '; }
          # 09:13:33 -> seconds since midnight; anything else -> nothing (the caller then says 0 s)
          sec() { [[ "$1" =~ ^([0-9]{2}):([0-9]{2}):([0-9]{2})$ ]] && echo $(( 10#${BASH_REMATCH[1]} * 3600 + 10#${BASH_REMATCH[2]} * 60 + 10#${BASH_REMATCH[3]} )); }
          # trustd's pinning database lock (below) is watched from now, so a lock that starts during the checks is seen.
          LOCKLOG="$RUNNER_TEMP/trust-lock.log"; : > "$LOCKLOG"
          xcrun simctl spawn "$UDID" log stream --style compact --level info --predicate \
            'process == "trustd" AND eventMessage CONTAINS "database is locked"' > "$LOCKLOG" 2>/dev/null &
          LOCKSTREAM=$!
          for TRY in 1 2 3 4; do
            : > "$LOG"
            # Safari's own processes only: other daemons (apsd, mobileassetd) check certificates too and would answer true.
            xcrun simctl spawn "$UDID" log stream --style compact --level info --predicate \
              '(process == "MobileSafari" OR process == "com.apple.WebKit.Networking") AND eventMessage CONTAINS "external verify block with result"' \
              > "$LOG" 2>/dev/null &
            STREAM=$!
            sleep 2
            xcrun simctl openurl "$UDID" "https://$HOST/?trust-warmup=$TRY" || true
            for _ in $(seq 1 60); do
              if [ -n "$(real 'result: true' "$LOG")" ]; then OK=1; break; fi
              sleep 1
            done
            kill "$STREAM" 2>/dev/null || true
            xcrun simctl terminate "$UDID" com.apple.mobilesafari 2>/dev/null || true
            [ -n "$OK" ] && break
            [ "$TRY" = 4 ] && break
            RESTARTS=$((RESTARTS + 1))
            echo "No answer on try $TRY: restarting the simulator's trustd"
            xcrun simctl spawn "$UDID" launchctl kickstart -k system/com.apple.trustd 2>/dev/null \
              || pkill -9 -f 'RuntimeRoot/usr/libexec/trustd' || true
            RESTARTED=$(date +%s)
            sleep 3
          done
          rm -f "$LOG"
          WAITED=$(( $(date +%s) - START ))
          if [ -z "$OK" ]; then
            kill "$LOCKSTREAM" 2>/dev/null || true
            echo "> ❌ **The simulator, not the app or this PR:** its trust check never answered (${WAITED} s, 4 tries, trustd restarted ${RESTARTS} times). Re-run the job." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Simulator, not the app::the simulator's trust check never answered (${WAITED} s, 4 tries, trustd restarted ${RESTARTS} times). Not the app or this PR: re-run the job."
            exit 1
          fi
          echo "Trust check answered after ${WAITED} s (try ${TRY}, trustd restarted ${RESTARTS} times)."
          # Then trustd's pinning database must be free: Safari, restarted each time so each visit makes a new
          # certificate check, opens the api every 8 s until 30 s pass with no "database is locked" from trustd, counted
          # from Safari's answer above, and 100 s have passed since this trustd's first check: the early one after boot,
          # or its last restart here, whichever is later (the lock began about 70 s after a first check). 6 minutes at
          # most. The lock stream has run since the step began.
          EARLYAT=$(cat "$RUNNER_TEMP/trust-first-use" 2>/dev/null || true)
          FIRST=${EARLYAT:-$START}
          [ "$RESTARTED" -gt "$FIRST" ] && FIRST=$RESTARTED
          LSTART=$(date +%s); LAST=$LSTART; SEEN=$(locked); FREE=
          while [ $(( $(date +%s) - LSTART )) -lt 360 ]; do
            xcrun simctl terminate "$UDID" com.apple.mobilesafari 2>/dev/null || true
            xcrun simctl openurl "$UDID" "https://$HOST/?trust-probe=$(date +%s)" || true
            sleep 8
            N=$(locked)
            if [ "$N" -gt "$SEEN" ]; then SEEN=$N; LAST=$(date +%s); fi
            NOW=$(date +%s)
            if [ $(( NOW - LAST )) -ge 30 ] && [ $(( NOW - FIRST )) -ge 100 ]; then FREE=1; break; fi
          done
          kill "$LOCKSTREAM" 2>/dev/null || true
          xcrun simctl terminate "$UDID" com.apple.mobilesafari 2>/dev/null || true
          # How long it was locked, from the log's own times (the first and the last locked read, UTC). A time that
          # doesn't parse gives 0 s; past midnight, a day is added.
          T1=$(real 'database is locked' "$LOCKLOG" | head -1 | awk '{print substr($2,1,8)}')
          T2=$(real 'database is locked' "$LOCKLOG" | tail -1 | awk '{print substr($2,1,8)}')
          rm -f "$LOCKLOG"
          S1=$(sec "$T1" || true); S2=$(sec "$T2" || true); HELD=0; SPAN=
          if [ -n "$S1" ] && [ -n "$S2" ]; then
            HELD=$(( S2 - S1 )); [ "$HELD" -lt 0 ] && HELD=$(( HELD + 86400 ))
            SPAN=", ${T1}-${T2} UTC"
          fi
          WAITED=$(( $(date +%s) - START ))
          if [ -z "$FREE" ]; then
            echo "> ❌ **The simulator, not the app or this PR:** its certificate service (trustd) kept its pinning database locked for 6 minutes (${SEEN} locked reads${SPAN}). Re-run the job." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Simulator, not the app::trustd's pinning database stayed locked for 6 minutes (${SEEN} locked reads). Not the app or this PR: re-run the job."
            exit 1
          fi
          EARLY=$([ -n "$EARLYAT" ] && echo "early first check $(( LSTART - EARLYAT )) s before" || echo "no early first check")
          LINE="Simulator trust check: free after ${WAITED} s in all, Safari answered on try ${TRY} of 4, trustd restarted ${RESTARTS} times; its pinning database locked ${SEEN} reads over ${HELD} s${SPAN} (${EARLY})."
          echo "$LINE"
          echo "> $LINE" >> "$GITHUB_STEP_SUMMARY"
          echo "T_WARM=$(date +%s)" >> "$GITHUB_ENV"
      # The signed-in journeys' people on staging (scripts/journey-people.mjs): a cook, her family link, and a kid who
      # joined by it. The link and both device keys are masked, then reach Maestro by $GITHUB_ENV. A fork's PR has no
      # secret, so the journeys tagged needs-key (2, 3 and 4) are left out and say so; a key that's set but refused
      # fails here, so a rotated key can't pass as a skip.
      # The step's name is the sweep's (journey-people-sweep.yml): rename both or neither.
      - name: Seed the journey test people
        env:
          TEST_SIGNIN_KEY: ${{ !inputs.no_key && secrets.TEST_SIGNIN_KEY || '' }}
        run: |
          if [ -z "$TEST_SIGNIN_KEY" ]; then
            echo "Journeys 2, 3 and 4 skipped: no TEST_SIGNIN_KEY (a fork's PR gets no secrets)."
            echo "> Journeys 2, 3 and 4 (family link sign-in; New message, Add family, Copy link; record and send) skipped: no TEST_SIGNIN_KEY, as on a fork's PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/journey-people.mjs setup "$RUNNER_TEMP/journey-people.json"
      # stall_api (manual runs only) checks the Try again retry: the api's host resolves to 192.0.2.1 (TEST-NET-1, which
      # never answers), so the app's requests hang like the trust-check stall. The simulator's sockets are the runner's,
      # so first-try sees the app's first try in netstat and brings the api back 15 s later, after the app's own 10 s
      # timeout has put up "We can't reach homecookd."; all keeps it down for the whole run.
      # A link open iOS gives up on (docs/build/IOS-JOURNEYS.md): after 10 s lsd stops waiting (Code=60) while SpringBoard
      # can still deliver the link seconds later, and Maestro's openLink then throws an error its retry can't catch. Maestro
      # runs xcrun from its PATH, so scripts/journey-xcrun.sh goes first: a failed open counts as opened only when this
      # step's stream shows lsd giving up and the app receiving a link within 30 s of the open, and the Times step warns
      # about each failed open, passed or not. Every open is logged, and the Times step's table shows when the app got
      # each link. The stream keeps only those two kinds of line; neither holds the link, and it stays on the runner.
      - name: Journeys
        env:
          STALL_API: ${{ inputs.stall_api || 'off' }}
          JOURNEY_OPENURL_FAKE: ${{ inputs.openurl_fault && 'first' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-out" "$RUNNER_TEMP/xcrun"
          ln -sf "$PWD/scripts/journey-xcrun.sh" "$RUNNER_TEMP/xcrun/xcrun"
          export JOURNEY_OPENURL_STREAM="$RUNNER_TEMP/openurl-stream.log" JOURNEY_OPENURL_LOG="$RUNNER_TEMP/openurl.jsonl"
          : > "$JOURNEY_OPENURL_LOG"
          xcrun simctl spawn "$UDID" log stream --style syslog --predicate \
            '(process == "lsd" AND eventMessage CONTAINS "_LSDispatchWithTimeout") OR (process == "homecookd" AND eventMessage CONTAINS "UIOpenURLAction")' \
            > "$JOURNEY_OPENURL_STREAM" 2>/dev/null &
          OPENSTREAM=$!
          trap 'kill $OPENSTREAM 2>/dev/null || true' EXIT
          if [ -n "$JOURNEY_OPENURL_FAKE" ]; then echo "openurl_fault: the first link open the app gets on its own counts as one iOS gave up on"; fi
          if [ "$STALL_API" != off ]; then
            HOST=${EXPO_PUBLIC_AWS_URL#https://}; HOST=${HOST%%/*}
            dns() { sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; }
            echo "192.0.2.1 $HOST # stall_api" | sudo tee -a /etc/hosts >/dev/null; dns
            echo "stall_api=$STALL_API: $HOST hangs from $(date -u +%T)"
            if [ "$STALL_API" = first-try ]; then
              ( until netstat -an | grep -q '192\.0\.2\.1\.443'; do sleep 1; done
                echo "The app's first try at $(date -u +%T)"; sleep 15
                sudo sed -i '' '/# stall_api$/d' /etc/hosts; dns; echo "$HOST answers again from $(date -u +%T)" ) &
            fi
          fi
          KEYED=(--exclude-tags needs-key)
          if [ -n "${KID_KEY:-}" ]; then KEYED=(-e "FAMILY_LINK=$FAMILY_LINK" -e "KID_KEY=$KID_KEY" -e "COOK_KEY=$COOK_KEY"); fi
          PATH="$RUNNER_TEMP/xcrun:$PATH" maestro --device "$UDID" test app/e2e/journeys --format junit \
            --output "$RUNNER_TEMP/maestro-out/report.xml" --test-output-dir "$RUNNER_TEMP/maestro-out" -e APP_ID="$APP_ID" "${KEYED[@]}"
          echo "T_JOURNEYS=$(date +%s)" >> "$GITHUB_ENV"
      - name: Times
        if: always()
        run: |
          m() { if [ -n "$2" ] && [ -n "$1" ]; then echo "$(( ($2 - $1) / 60 ))m $(( ($2 - $1) % 60 ))s"; else echo "—"; fi; }
          {
            echo "### iOS journeys: times (native app ${NATIVE:-built}${CCACHE_LINE:+; ccache: $CCACHE_LINE})"
            echo "| Phase | Time |"; echo "|---|---|"
            echo "| npm ci + prebuild | $(m "$T0" "$T_PREBUILD") |"
            echo "| Pods (with cache) | $(m "$T_PREBUILD" "$T_PODS") |"
            echo "| xcodebuild Release, or the JS bundle into the reused app | $(m "$T_PODS" "$T_BUILD") |"
            echo "| Wait for the simulator (booting since the start) + install | $(m "$T_BUILD" "$T_BOOT") |"
            echo "| Install Maestro + the simulator's trust check (Safari warm-up) | $(m "$T_BOOT" "$T_WARM") |"
            echo "| Seed + Maestro journeys | $(m "${T_WARM:-$T_BOOT}" "$T_JOURNEYS") |"
            echo "| **Total** | $(m "$T0" "${T_JOURNEYS:-$(date +%s)}") |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A journey that needed a retry in open-link.yaml (a Try again tap on a card, or opening the link again) says so,
          # even when it passed, and so does every link open simctl failed (journey-xcrun.sh), landed or not, and every
          # open whose link reached the app more than 30 s after it. Then a table of every open and how long it took, in
          # the job log too: GitHub shows a job summary only to a signed-in browser, and `gh run view --log` reads the log.
          OPENS=("$RUNNER_TEMP/maestro-out" "$RUNNER_TEMP/openurl.jsonl" "$RUNNER_TEMP/openurl-stream.log")
          node scripts/journey-retries.mjs "${OPENS[@]}" | while IFS= read -r LINE; do
            echo "::warning title=Journey retry::$LINE"
            echo "> ⚠️ $LINE" >> "$GITHUB_STEP_SUMMARY"
          done
          node scripts/journey-retries.mjs --table "${OPENS[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || true
      # A certificate stall names itself (Master Agent, Nov 10; scripts/journey-trust.mjs, tested). trustd, the
      # simulator's certificate service, sometimes stops checking anything for minutes, even after the trust check
      # passed (42898927696: it started rebuilding its pinning database 58 s later), and every handshake then fails, the
      # app's included. Each journey whose app had a check fail gets a warning: when trustd last checked anything,
      # whether it was rebuilding or locked, and other processes' results beside the app's, so a stall reads as the
      # simulator and a failure only the app had reads as the api's certificate. Each rebuild or lock in the run gets a
      # line too, with when trustd checked again, if it did: what a fix would need to know. The kept file has times,
      # pids, versions and per-minute counts only, and goes through the same scrub as every log below.
      - name: Name a certificate stall
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/maestro-out" ] || exit 0
          node scripts/journey-trust.mjs "$RUNNER_TEMP/maestro-out" "$RUNNER_TEMP/trustd-stream.log" "${T_WARM:-}" \
            --summary "$RUNNER_TEMP/maestro-out/trustd-summary.txt" | while IFS= read -r LINE; do
            case "$LINE" in
              trustd*) echo "$LINE"; echo "> $LINE" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "::warning title=Certificate stall::$LINE"; echo "> ⚠️ $LINE" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          done
      # Maestro echoes an opened link, and every -e value, in each flow's commands.json and logs. So when the keyed
      # journeys ran, every flow keeps only its screenshots and the simulator's log (report.xml stays): commands.json,
      # Maestro's own logs and the screen dumps go. In the simulator's log, which shows a stall's cause (trustd, #456),
      # each exact value (both device keys, the link's token, the test ids) and every S3 query string or X-Amz value
      # becomes ***. Without a key (a fork's PR) the launch journey keeps everything: its made-up link is no secret. Then
      # any file still holding a key, the token or an X-Amz value goes, with a warning: a leak this step didn't expect.
      # It fails closed (Master Agent, Nov 10): any error in it removes every logs/ folder, and the upload runs only
      # when this step succeeded, so a log the scrub didn't finish never reaches the artifact on a public repo.
      - name: Drop what echoes a key or a link
        id: scrub
        if: always()
        run: |
          trap 'rm -rf "$RUNNER_TEMP"/maestro-out/*/*/logs "$RUNNER_TEMP"/maestro-out/trustd-summary.txt; echo "::warning title=Journey files::the scrub failed, so every log was removed and nothing is uploaded"' ERR
          shopt -s nullglob
          for d in "$RUNNER_TEMP"/maestro-out/*/*/; do
            if [ -z "${KID_KEY:-}" ] && [ "$(basename "$d")" = "Launch, then a link that doesn't work" ]; then continue; fi
            rm -rf "$d/commands.json" "$d/screen-hierarchy"
            find "$d/logs" -type f ! -name device-simulator.log -delete 2>/dev/null || true
          done
          SECRETS=("${KID_KEY:-}" "${COOK_KEY:-}" "${FAMILY_LINK#*t=}" "j${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cook" "j${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-kid")
          # Each kept log (scripts/journey-scrub.mjs, tested): every value above, an S3 address's query string (a presigned
          # upload URL holds a temporary key id and session token: run 42852281034 logged one, cut short by iOS) and any
          # X-Amz value become ***. A log it can't read and rewrite, or that still holds one, is deleted with a warning.
          # (trustd-summary.tx[t]: a glob, so with nullglob a run that never wrote it passes nothing, not a missing file)
          DROPS=$(JOURNEY_SCRUB_VALUES="$(printf '%s\n' "${SECRETS[@]}")" node scripts/journey-scrub.mjs \
            "$RUNNER_TEMP"/maestro-out/*/*/logs/device-simulator.log "$RUNNER_TEMP"/maestro-out/trustd-summary.tx[t])
          while IFS= read -r LINE; do [ -z "$LINE" ] || echo "::warning title=Journey files::$LINE"; done <<< "$DROPS"
          for v in "${KID_KEY:-}" "${COOK_KEY:-}" "${FAMILY_LINK#*t=}"; do
            [ -n "$v" ] || continue
            { grep -rlF -- "$v" "$RUNNER_TEMP/maestro-out" 2>/dev/null || true; } | while IFS= read -r f; do
              echo "::warning title=Journey files::dropped $(basename "$f"): it held a key or a link"; rm -f "$f"
            done
          done
          { grep -rlIiE 'x-amz-[a-z0-9-]+(=|: *|%3[da])[^*&[:space:]]' "$RUNNER_TEMP/maestro-out" 2>/dev/null || true; } | while IFS= read -r f; do
            echo "::warning title=Journey files::dropped $(basename "$f"): it held an X-Amz value"; rm -f "$f"
          done
      - name: Keep Maestro's screenshots and report
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maestro-out
          retention-days: 7
          if-no-files-found: ignore

      # The test people go whatever happened above (a stall_api run's hosts entry first, or staging can't be reached).
      # A runner that dies never gets here: journey-people-sweep.yml finds those runs by this step's name, the same day.
      - name: Delete the journey test people
        if: always()
        env:
          TEST_SIGNIN_KEY: ${{ !inputs.no_key && secrets.TEST_SIGNIN_KEY || '' }}
        run: |
          [ -f "$RUNNER_TEMP/journey-people.json" ] || { echo "No test people were made."; exit 0; }
          if grep -q '# stall_api$' /etc/hosts; then
            sudo sed -i '' '/# stall_api$/d' /etc/hosts; sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
          fi
          node scripts/journey-people.mjs delete "$RUNNER_TEMP/journey-people.json"

  # The one to require on main: a skipped journeys job (no app/ change) passes, a failed or cancelled one doesn't.
  result:
    name: ios-journeys
    if: always()
    needs: [scope, journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Journeys passed, or there was nothing to run
        run: |
          echo "scope: ${{ needs.scope.result }}, journeys: ${{ needs.journeys.result }}"
          [ "${{ needs.scope.result }}" = "success" ] || exit 1
          case "${{ needs.journeys.result }}" in success|skipped) exit 0 ;; *) exit 1 ;; esac
