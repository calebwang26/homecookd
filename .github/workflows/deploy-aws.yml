# Builds one service from this commit and rolls it out on AWS. Manual only. It logs in with GitHub's OIDC login, so no
# key is stored in GitHub. Needs the repo variable AWS_ACCOUNT_ID and a GitHub environment named like the target.
name: Deploy to AWS
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      service:
        type: choice
        options: [api, voice, worker]
        default: api
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      service:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      NAME: homecookd-${{ inputs.environment }}
      SERVICE: ${{ inputs.service }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/homecookd-${{ inputs.environment }}-deploy
          aws-region: us-west-2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push
        run: |
          IMAGE="$REGISTRY/$NAME/$SERVICE:$GITHUB_SHA"
          DIR=$([ "$SERVICE" = worker ] && echo pipeline || echo "$SERVICE")
          # Tags can't be overwritten, so a commit that's already built just rolls out again.
          if aws ecr describe-images --repository-name "$NAME/$SERVICE" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Already built: $IMAGE"
          else
            docker build -t "$IMAGE" "$DIR"
            docker push "$IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Roll out
        run: |
          aws ecs describe-task-definition --task-definition "$NAME-$SERVICE" --query taskDefinition > current.json
          jq --arg image "$IMAGE" --arg release "$GITHUB_SHA" '.containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = ([.containerDefinitions[0].environment[] | select(.name != "RELEASE")] + [{name: "RELEASE", value: $release}])
            | {family, containerDefinitions, taskRoleArn, executionRoleArn, networkMode, requiresCompatibilities, cpu, memory}' \
            current.json > next.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://next.json --query taskDefinition.taskDefinitionArn --output text)
          if [ "$SERVICE" = api ]; then
            # Migrations run as their own task, this release's image with the master database login, which the api and worker don't get (infra/README.md, "Database logins").
            # Until infra has made that task, the api's own task runs them as before: it still has the master login then, because db_iam_login is off until it exists.
            NETWORK=$(aws ecs describe-services --cluster "$NAME" --services api \
              --query 'services[0].networkConfiguration' --output json)
            if aws ecs describe-task-definition --task-definition "$NAME-migrate" --query taskDefinition > migrate.json 2>/dev/null; then
              jq --arg image "$IMAGE" '.containerDefinitions[0].image = $image
                | {family, containerDefinitions, taskRoleArn, executionRoleArn, networkMode, requiresCompatibilities, cpu, memory}' \
                migrate.json > migrate-next.json
              MIGRATE=$(aws ecs register-task-definition --cli-input-json file://migrate-next.json --query taskDefinition.taskDefinitionArn --output text)
              TASK=$(aws ecs run-task --cluster "$NAME" --launch-type FARGATE --task-definition "$MIGRATE" \
                --network-configuration "$NETWORK" \
                --query 'tasks[0].taskArn' --output text)
            else
              echo "No $NAME-migrate task definition yet, so the api's task runs the migrations."
              TASK=$(aws ecs run-task --cluster "$NAME" --launch-type FARGATE --task-definition "$ARN" \
                --network-configuration "$NETWORK" \
                --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/migrate.js"]}]}' \
                --query 'tasks[0].taskArn' --output text)
            fi
            aws ecs wait tasks-stopped --cluster "$NAME" --tasks "$TASK"
            CODE=$(aws ecs describe-tasks --cluster "$NAME" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
            if [ "$CODE" != 0 ]; then echo "Migrations failed ($CODE): nothing rolled out."; exit 1; fi
          fi
          aws ecs update-service --cluster "$NAME" --service "$SERVICE" --task-definition "$ARN" >/dev/null
          echo "Rolling out $ARN. Until voice/ holds task protection (phase 3), this can cut live voice calls."
      - name: Wait, then smoke test
        run: |
          aws ecs wait services-stable --cluster "$NAME" --services "$SERVICE"
          COUNT=$(aws ecs describe-services --cluster "$NAME" --services "$SERVICE" --query 'services[0].desiredCount' --output text)
          if [ "$SERVICE" = api ] && [ "$COUNT" != 0 ] && [ -n "${{ vars.STAGING_URL }}" ] && [ "${{ inputs.environment }}" = staging ]; then
            curl -sSf --max-time 15 "${{ vars.STAGING_URL }}/health"
          else
            echo "No smoke test for $SERVICE with $COUNT tasks."
          fi
