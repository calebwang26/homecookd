<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leo · Ingredients</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'DM Sans', system-ui, sans-serif; color: #2D3222">

  <div style="position: absolute; left: 24px; right: 24px; top: 56px; display: flex; flex-direction: column; gap: 28px">

    <!-- Top row -->
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="Kid-Recipe.dc.html" aria-label="Back to the recipe" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFDF7; box-shadow: 0 4px 14px rgba(30,36,16,0.08); color: #1E2410; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="flex: 1; font-size: 15px; font-weight: 600; color: #5F6352">Pork &amp; Chive Dumplings</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #E6EBCF; color: #3C4A0B; font-size: 14px; font-weight: 700; line-height: 32px">{{doneCount}} of 6</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; color: #1E2410">Get these ready</h1>
      <p style="margin: 0; font-size: 16px; color: #5F6352">Tap each one as you set it out.</p>
    </div>

    <!-- The six -->
    <div style="border-radius: 28px; background: #FFFDF7; box-shadow: 0 8px 24px rgba(30,36,16,0.06); padding: 6px 8px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <button aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}" style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border: none; border-radius: 20px; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer">
          <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: {{item.ring}}; background: {{item.fill}}; color: #FFFDF7; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600; color: {{item.color}}">{{item.words}}</span>
            <span style="font-size: 14px; color: #5F6352">{{item.amount}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <button aria-expanded="false" style="align-self: center; height: 44px; padding: 0 16px; border: none; background: none; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #4C5A10; cursor: pointer">
      Swaps and shopping tips
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <a href="Kid-Step.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 60px; border-radius: 999px; background: #5B6F00; color: #FFFDF7; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; box-shadow: 0 10px 24px rgba(52,67,12,0.25)">
    Start step 1
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: [true, true, false, false, false, false] }; }
  renderVals() {
    const list = [
      ['“the small pack of pork”', '~1 lb ground pork'],
      ['“a big handful of chives”', '~1 cup, chopped'],
      ['“ginger, three coins”', '~3 thin slices'],
      ['“soy sauce, two spoons”', '~2 tbsp'],
      ['“flour, two rice bowls”', '~3 cups'],
      ['“water, warm like a baby’s bath”', '~1 cup']
    ];
    const done = this.state.done;
    return {
      doneCount: done.filter(Boolean).length,
      items: list.map((x, i) => ({
        words: x[0],
        amount: x[1],
        pressed: done[i] ? 'true' : 'false',
        fill: done[i] ? '#5B6F00' : 'transparent',
        ring: done[i] ? 'none' : '2px solid rgba(30,36,16,0.2)',
        color: done[i] ? '#5F6352' : '#1E2410',
        toggle: () => { const d = done.slice(); d[i] = !d[i]; this.setState({ done: d }); }
      }))
    };
  }
}
</script>
</body>
</html>
