<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leo · Chat with Mom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
input::placeholder{color:#5F6352}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'DM Sans', system-ui, sans-serif; color: #2D3222">

  <!-- Header -->
  <header style="position: absolute; left: 24px; right: 24px; top: 56px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Kid-Messages.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFDF7; box-shadow: 0 4px 14px rgba(30,36,16,0.08); color: #1E2410; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none"><img src="/_blob/7bbeacdc28a70fc73cb3459375580ad2" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 43% 35%; transform: scale(1.8); transform-origin: 29% 24%"></span>
      <h1 style="margin: 0; flex: 1; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 24px; color: #1E2410">Mom</h1>
    </div>
    <a href="Kid-Recipe.dc.html" aria-label="Open the recipe: Pork and Chive Dumplings" style="align-self: flex-start; height: 40px; padding: 0 14px 0 4px; border-radius: 999px; background: #FFFDF7; box-shadow: 0 2px 8px rgba(30,36,16,0.05); display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5F6352">
      <img src="/_blob/5f6691812e5cae66ec7796f79da7ff26" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover">
      About <span style="font-weight: 700; color: #1E2410">Pork &amp; Chive Dumplings</span>
    </a>
  </header>

  <!-- Conversation -->
  <div role="log" aria-label="Messages with Mom" style="position: absolute; left: 24px; right: 24px; top: 176px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600; color: #5F6352">Sunday</p>

    <div style="align-self: flex-end; max-width: 270px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <a href="Kid-Step.dc.html" style="font-size: 13px; font-weight: 700; color: #3F3558">Step 5 · Boil</a>
      <span style="padding: 12px 16px; border-radius: 20px 20px 6px 20px; background: #ECE6F2; font-size: 16px; line-height: 1.4; color: #1E2410">Do I boil them frozen or thawed?</span>
      <span style="font-size: 12px; color: #5F6352">7:05 pm</span>
    </div>

    <div style="align-self: flex-start; max-width: 290px; display: flex; flex-direction: column; gap: 6px">
      <div style="padding: 10px 16px 10px 10px; border-radius: 20px 20px 20px 6px; background: #F9E3CF; display: flex; align-items: center; gap: 12px">
        <button aria-label="Play Mom's voice note, 0:38" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #1E2410; color: #FFFDF7; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
        </button>
        <svg width="130" height="28" viewBox="0 0 130 28" aria-hidden="true" fill="#6E4A33"><rect x="0" y="11" width="3" height="6" rx="1.5"/><rect x="8" y="7" width="3" height="14" rx="1.5"/><rect x="16" y="3" width="3" height="22" rx="1.5"/><rect x="24" y="9" width="3" height="10" rx="1.5"/><rect x="32" y="5" width="3" height="18" rx="1.5"/><rect x="40" y="10" width="3" height="8" rx="1.5"/><rect x="48" y="2" width="3" height="24" rx="1.5"/><rect x="56" y="8" width="3" height="12" rx="1.5"/><rect x="64" y="11" width="3" height="6" rx="1.5"/><rect x="72" y="6" width="3" height="16" rx="1.5"/><rect x="80" y="9" width="3" height="10" rx="1.5"/><rect x="88" y="4" width="3" height="20" rx="1.5"/><rect x="96" y="10" width="3" height="8" rx="1.5"/><rect x="104" y="7" width="3" height="14" rx="1.5"/><rect x="112" y="11" width="3" height="6" rx="1.5"/><rect x="120" y="9" width="3" height="10" rx="1.5"/></svg>
        <span style="font-size: 14px; font-weight: 700; color: #6E4A33">0:38</span>
      </div>
      <button aria-expanded="{{wordsOpen}}" onClick="{{toggleWords}}" style="align-self: flex-start; height: 32px; padding: 0 4px; border: none; background: none; font-size: 13px; font-weight: 700; color: #6E4A33; cursor: pointer">{{wordsLabel}}</button>
      <sc-if value="{{showWords}}" hint-placeholder-val="{{ false }}">
        <span style="padding: 12px 16px; border-radius: 20px; background: #FFFDF7; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.4; color: #1E2410">[Mom's voice note, written out]</span>
      </sc-if>
      <span style="padding: 12px 16px; border-radius: 20px 20px 20px 6px; background: #F9E3CF; font-size: 16px; line-height: 1.4; color: #1E2410">Make 10 tonight, freeze the rest. Love you.</span>
      <span style="font-size: 12px; color: #5F6352">8:31 pm</span>
    </div>

    <div style="align-self: flex-end; max-width: 270px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <a href="Kid-Step.dc.html" style="font-size: 13px; font-weight: 700; color: #3F3558">Step 3 · Roll the wrappers</a>
      <span style="padding: 12px 16px; border-radius: 20px 20px 6px 20px; background: #ECE6F2; font-size: 16px; line-height: 1.4; color: #1E2410">How thin should the wrappers be?</span>
      <span style="font-size: 12px; color: #5F6352">11:52 pm · Sent. We'll tell you when she answers.</span>
    </div>
  </div>

  <!-- Composer -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 28px; display: flex; gap: 10px; align-items: center">
    <label style="flex: 1; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 999px; background: #FFFDF7; box-shadow: 0 6px 20px rgba(30,36,16,0.08); display: flex; align-items: center">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Ask Mom something</span>
      <input type="text" placeholder="Ask Mom something" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #1E2410">
    </label>
    <button aria-label="Tap to talk" style="width: 56px; height: 56px; border: none; border-radius: 50%; background: #1E2410; color: #FFFDF7; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; }
  renderVals() {
    const open = this.state.open;
    return {
      showWords: open,
      wordsOpen: open ? 'true' : 'false',
      wordsLabel: open ? 'Hide her words' : 'Show her words',
      toggleWords: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
