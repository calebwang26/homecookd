            <img src="/_blob/08296476270194781cf5bae7bfb372a8" alt="" style="width: 64px; height: 64px; border-radius: 18px; object-fit: cover; flex: none">

            </span>

          <button aria-label="Save Ramen, Mom's Way" aria-pressed="false" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; color: #5F6352; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
          </button>

  <!-- Floating tab bar -->
  <nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 76px; box-sizing: border-box; padding: 8px; border-radius: 999px; background: rgba(255,253,247,0.96); box-shadow: 0 10px 30px rgba(30,36,16,0.14), 0 0 0 1px rgba(30,36,16,0.04); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cook: 'Everyone' }; }
  renderVals() {
    const cooks = ['Everyone', 'Mom', 'Dad', 'Nai Nai', 'Auntie Lin'];
    return {
      chips: cooks.map((c) => ({
        label: c,
        pressed: this.state.cook === c ? 'true' : 'false',
        bg: this.state.cook === c ? '#FEBE29' : '#FFFDF7',
        pick: () => this.setState({ cook: c })
      }))
    };
  }
}
</script>
