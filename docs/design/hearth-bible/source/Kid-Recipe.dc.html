        <span style="width: 24px; height: 24px; border-radius: 50%; overflow: hidden"><img src="/_blob/7bbeacdc28a70fc73cb3459375580ad2" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 43% 35%; transform: scale(1.8); transform-origin: 29% 24%"></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { forWho: 'me' }; }
  renderVals() {
    const me = this.state.forWho === 'me';
    const on = '#FFFDF7', off = 'transparent', sh = '0 2px 8px rgba(30,36,16,0.08)';
    return {
      meOn: me ? 'true' : 'false',
      friendsOn: me ? 'false' : 'true',
      meBg: me ? on : off,
      friendsBg: me ? off : on,
      meShadow: me ? sh : 'none',
      friendsShadow: me ? 'none' : sh,
      pickMe: () => this.setState({ forWho: 'me' }),
      pickFriends: () => this.setState({ forWho: 'friends' })
    };
  }
}
</script>
