<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mom · Chat with Leo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'DM Sans', system-ui, sans-serif; color: #2D3222">

  <!-- Header -->
  <header style="position: absolute; left: 24px; right: 24px; top: 56px; display: flex; align-items: center; gap: 12px">
    <a href="Parent-Messages.dc.html" style="height: 48px; padding: 0 18px 0 12px; border-radius: 999px; background: #FFFDF7; box-shadow: 0 4px 14px rgba(30,36,16,0.08); color: #1E2410; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back
    </a>
    <span style="flex: 1"></span>
    <span style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none"><img src="/_blob/0503d233d0ec31faf84025ed4c3c73e6" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 42% 36%; transform: scale(3); transform-origin: 40% 35%"></span>
    <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 24px; color: #1E2410">Leo</h1>
  </header>

  <!-- Conversation -->
  <div role="log" aria-label="Messages with Leo" style="position: absolute; left: 24px; right: 24px; top: 132px; display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; text-align: center; font-size: 14px; color: #5F6352">About your <span style="font-weight: 700; color: #1E2410">Pork &amp; Chive Dumplings</span></p>

    <div style="align-self: flex-start; max-width: 280px; display: flex; flex-direction: column; gap: 6px">
      <span style="padding: 14px 18px; border-radius: 22px 22px 22px 6px; background: #ECE6F2; font-size: 17px; line-height: 1.4; color: #1E2410">Do I boil them frozen or thawed?</span>
      <span style="font-size: 13px; color: #5F6352">Sunday, 7:05 pm</span>
    </div>

    <div style="align-self: flex-end; max-width: 290px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <div style="padding: 10px 18px 10px 10px; border-radius: 22px 22px 6px 22px; background: #F9E3CF; display: flex; align-items: center; gap: 12px">
        <button aria-label="Play your voice answer, 0:38" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #1E2410; color: #FFFDF7; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
        </button>
        <span style="font-size: 16px; font-weight: 700; color: #6E4A33">Your voice · 0:38</span>
      </div>
      <span style="padding: 14px 18px; border-radius: 22px 22px 6px 22px; background: #F9E3CF; font-size: 17px; line-height: 1.4; color: #1E2410">Make 10 tonight, freeze the rest. Love you.</span>
      <span style="font-size: 13px; color: #5F6352">8:31 pm</span>
    </div>

    <div style="align-self: flex-start; max-width: 280px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 700; color: #3F3558">Step 3 · Roll the wrappers</span>
      <span style="padding: 14px 18px; border-radius: 22px 22px 22px 6px; background: #ECE6F2; box-shadow: 0 0 0 2px #FEBE29; font-size: 17px; line-height: 1.4; color: #1E2410">How thin should the wrappers be?</span>
      <span style="font-size: 13px; font-weight: 700; color: #5A3A22">Last night · waiting for you</span>
    </div>
  </div>

  <!-- Answer: one big mic -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 230px; box-sizing: border-box; padding: 28px 24px 24px; border-radius: 32px 32px 0 0; background: #FFFDF7; box-shadow: 0 -10px 30px rgba(30,36,16,0.06); display: flex; flex-direction: column; align-items: center; gap: 12px">
    <button aria-pressed="{{recOn}}" onClick="{{toggleRec}}" aria-label="{{recLabel}}" style="width: 92px; height: 92px; border: none; border-radius: 50%; background: {{recBg}}; color: #FFFDF7; box-shadow: {{recRing}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{recording}}" hint-placeholder-val="{{ false }}">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
      </sc-if>
      <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </sc-if>
    </button>
    <span style="font-size: 18px; font-weight: 700; color: #1E2410">{{recLabel}}</span>
    <button style="height: 40px; padding: 0 12px; border: none; background: none; font-size: 15px; font-weight: 600; color: #4C5A10; cursor: pointer">Type instead</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rec: false }; }
  renderVals() {
    const rec = this.state.rec;
    return {
      recording: rec,
      idle: !rec,
      recOn: rec ? 'true' : 'false',
      recLabel: rec ? 'Tap again to send' : 'Tap to talk',
      recBg: rec ? '#9A4F47' : '#5B6F00',
      recRing: rec ? '0 0 0 10px rgba(154,79,71,0.18)' : '0 12px 28px rgba(52,67,12,0.3)',
      toggleRec: () => this.setState({ rec: !rec })
    };
  }
}
</script>
</body>
</html>
